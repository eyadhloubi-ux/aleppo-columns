services:
  - type: web
    name: aleppo-columns
    runtime: static
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
